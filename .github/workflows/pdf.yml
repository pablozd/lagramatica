name: Compilar PDF
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          # \include con -output-directory necesita las subcarpetas creadas
          pre_compile: mkdir -p build/preliminares build/capitulos build/finales
      - uses: actions/upload-artifact@v4
        with:
          name: manual-pdf
          path: build/main.pdf
